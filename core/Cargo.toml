[package]
name = "penelope-core"
version = "0.11.0"
edition = "2021"
description = "The shared core of Penelope: settings, sessions, models, tools, clusters, memory and cost. No user interface."
license = "MIT"

[lib]
name = "penelope_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rhai = { version = "1", features = ["serde"] }
jsonschema = { version = "0.26", default-features = false }
ureq = { version = "2", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[features]
# The local HTTP fake for tests of a frontend crate. No production build enables it.
test-fake = []
