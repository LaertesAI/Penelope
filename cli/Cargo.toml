[package]
name = "katecli"
version = "0.3.0"
edition = "2021"
description = "Kate: a small agent harness with a memory map, routed tool output and ScreenCodec as its eyes"
license = "MIT"

[dependencies]
ratatui = "0.30"
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 2
strip = true
