[package]
name = "strix-forgery"
version = "0.4.0"
edition = "2021"
description = "Strix Forgery: a small agent harness with a memory map, routed tool output and ScreenCodec as its eyes"
license = "MIT"

[[bin]]
name = "strix"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 2
strip = true
