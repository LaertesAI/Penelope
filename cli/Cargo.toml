[package]
name = "penelope"
version = "0.11.0"
edition = "2021"
description = "Penelope: a small agent harness with a memory map, routed tool output and ScreenCodec as its eyes"
license = "MIT"

[[bin]]
name = "penelope"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
serde_json = "1"
unicode-width = "0.2"
regex = "1"
ureq = { version = "2", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = 2
strip = true
